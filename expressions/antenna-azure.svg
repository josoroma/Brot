<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Realistic 3D antenna bot — Azure · Curious</title><desc id="desc">A compact glossy azure · curious robot animates its antenna, eyes, body turn, legs and camera in a five-second loop.</desc>
  <defs>
    <radialGradient id="shell" cx="32%" cy="18%" r="84%"><stop stop-color="#C7F0FF"/><stop offset=".28" stop-color="#45BFFF"/><stop offset=".72" stop-color="#45BFFF"/><stop offset="1" stop-color="#1266B2"/></radialGradient>
    <linearGradient id="shell-side" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1266B2"/><stop offset="1" stop-color="#11131A"/></linearGradient>
    <linearGradient id="visor" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#394156"/><stop offset=".25" stop-color="#161D2C"/><stop offset="1" stop-color="#03050A"/></linearGradient>
    <radialGradient id="shine" cx="28%" cy="8%" r="72%"><stop stop-color="#FFF" stop-opacity=".76"/><stop offset=".42" stop-color="#FFF" stop-opacity=".08"/><stop offset="1" stop-color="#FFF" stop-opacity="0"/></radialGradient>
    <filter id="ambient" x="-45%" y="-45%" width="190%" height="200%"><feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity=".58"/><feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#42C8FF" flood-opacity=".35"/></filter>
    <filter id="eye-light" x="-150%" y="-150%" width="400%" height="400%"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="256" height="256" rx="28" fill="#08111F"/>
  <g><animateTransform attributeName="transform" type="translate" values="0 3;0 3;6 -5;6 -5;0 3" keyTimes="0;.18;.58;.78;1" dur="5s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1"/>
    <g transform="translate(128 128)"><g><animateTransform attributeName="transform" type="scale" values="1;1;1.07;1.07;1" keyTimes="0;.18;.58;.78;1" dur="5s" repeatCount="indefinite"/><g transform="translate(-128 -128)" filter="url(#ambient)">
      <g><animateTransform attributeName="transform" type="rotate" values="0 128 139;0 128 139;-9 128 139;-9 128 139;0 128 139" keyTimes="0;.18;.58;.78;1" dur="5s" repeatCount="indefinite"/>
        <g id="legs">
          <rect x="87" y="179" width="30" height="43" rx="13" fill="url(#shell-side)"/><rect x="139" y="179" width="30" height="43" rx="13" fill="url(#shell-side)"/>
          <rect x="84" y="202" width="36" height="25" rx="12" fill="url(#shell)"/><rect x="136" y="202" width="36" height="25" rx="12" fill="url(#shell)"/>
          <animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 4;0 4;0 0" keyTimes="0;.18;.58;.78;1" dur="5s" repeatCount="indefinite"/>
        </g>
        <rect x="55" y="65" width="151" height="132" rx="46" fill="url(#shell-side)" transform="translate(5 6)" opacity=".9"/>
        <rect x="50" y="59" width="151" height="132" rx="46" fill="url(#shell)"/>
        <rect x="50" y="59" width="151" height="132" rx="46" fill="url(#shine)" opacity=".66"/>
        <path d="M76 72C101 54 151 53 177 72" fill="none" stroke="#FFF" stroke-width="6" stroke-linecap="round" opacity=".34"/>
        <g id="antenna"><animateTransform attributeName="transform" type="rotate" values="0 128 61;0 128 61;-14 128 61;-14 128 61;0 128 61" keyTimes="0;.18;.58;.78;1" dur="5s" repeatCount="indefinite"/>
          <rect x="124" y="29" width="8" height="39" rx="4" fill="url(#shell)"/><circle cx="128" cy="24" r="11" fill="url(#shell)"/><circle cx="124" cy="20" r="3" fill="#FFF" opacity=".55"/>
        </g>
        <g><animateTransform attributeName="transform" type="translate" values="0 0;0 0;7 0;7 0;0 0" keyTimes="0;.18;.58;.78;1" dur="5s" repeatCount="indefinite"/>
          <rect x="69" y="91" width="113" height="66" rx="29" fill="url(#visor)" stroke="#46516B" stroke-width="3"/>
          <path d="M84 102C108 87 150 88 169 102" fill="none" stroke="#FFF" stroke-width="4" stroke-linecap="round" opacity=".15"/>
          <g fill="#F9FFFF" filter="url(#eye-light)">
            <ellipse cx="104" cy="124" rx="12" ry="18"><animate attributeName="cy" values="124;124;121;121;124" keyTimes="0;.18;.58;.78;1" dur="5s" repeatCount="indefinite"/><animate attributeName="ry" values="18;18;27;27;18" keyTimes="0;.18;.58;.78;1" dur="5s" repeatCount="indefinite"/></ellipse>
            <ellipse cx="148" cy="124" rx="12" ry="18"><animate attributeName="cy" values="124;124;121;121;124" keyTimes="0;.18;.58;.78;1" dur="5s" repeatCount="indefinite"/><animate attributeName="ry" values="18;18;27;27;18" keyTimes="0;.18;.58;.78;1" dur="5s" repeatCount="indefinite"/></ellipse>
          </g>
        </g>
        <rect x="92" y="173" width="22" height="8" rx="4" fill="#42C8FF" opacity=".45"/><rect x="137" y="173" width="22" height="8" rx="4" fill="#42C8FF" opacity=".45"/>
      </g>
    </g></g></g>
  </g>
</svg>
