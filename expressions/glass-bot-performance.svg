        <path d="M80 76C104 57 154 56 178 76" fill="none" stroke="#FFF" stroke-width="5" stroke-linecap="round" opacity=".16"/>
        <g fill="#F8FFFF" filter="url(#face-light)">
          <rect x="84" y="104" width="28" height="31" rx="14"><animate attributeName="x" values="84;88;81;85;84" keyTimes="0;.24;.52;.78;1" dur="5s" repeatCount="indefinite"/><animate attributeName="y" values="104;107;98;116;104" keyTimes="0;.24;.52;.78;1" dur="5s" repeatCount="indefinite"/><animate attributeName="width" values="28;24;34;27;28" keyTimes="0;.24;.52;.78;1" dur="5s" repeatCount="indefinite"/><animate attributeName="height" values="31;25;40;12;31" keyTimes="0;.24;.52;.78;1" dur="5s" repeatCount="indefinite"/><animate attributeName="rx" values="14;12;17;6;14" keyTimes="0;.24;.52;.78;1" dur="5s" repeatCount="indefinite"/></rect>
          <rect x="144" y="104" width="28" height="31" rx="14"><animate attributeName="x" values="144;148;141;144;144" keyTimes="0;.24;.52;.78;1" dur="5s" repeatCount="indefinite"/><animate attributeName="y" values="104;103;98;116;104" keyTimes="0;.24;.52;.78;1" dur="5s" repeatCount="indefinite"/><animate attributeName="width" values="28;20;34;27;28" keyTimes="0;.24;.52;.78;1" dur="5s" repeatCount="indefinite"/><animate attributeName="height" values="31;31;40;12;31" keyTimes="0;.24;.52;.78;1" dur="5s" repeatCount="indefinite"/><animate attributeName="rx" values="14;10;17;6;14" keyTimes="0;.24;.52;.78;1" dur="5s" repeatCount="indefinite"/></rect>
