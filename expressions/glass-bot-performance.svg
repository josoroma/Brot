    <g transform="translate(128 128)"><g><animateTransform attributeName="transform" type="scale" values="1;1.01;1.06;.98;1" keyTimes="0;.24;.52;.78;1" dur="5s" repeatCount="indefinite"/><g transform="translate(-128 -128)">
      <g><animateTransform attributeName="transform" type="rotate" values="0 128 128;-6 128 128;3 128 128;-3 128 128;0 128 128" keyTimes="0;.24;.52;.78;1" dur="5s" repeatCount="indefinite"/>
        <circle cx="128" cy="126" r="92" fill="url(#shell)"/>
        <circle cx="128" cy="126" r="92" fill="url(#shell-shade)"/>
