<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">Spherical multi-expression bot</title>
  <desc id="desc">A realistic spherical robot transitions through neutral, curiosity, delighted surprise, tiredness, and returns to neutral in five seconds.</desc>
  <defs>
    <radialGradient id="shell" cx="30%" cy="20%" r="82%"><stop stop-color="#E7FFFF"/><stop offset=".2" stop-color="#70F2FF"/><stop offset=".52" stop-color="#3F9EFF"/><stop offset=".78" stop-color="#756DFF"/><stop offset="1" stop-color="#B34DD1"/></radialGradient>
    <radialGradient id="shell-shade" cx="31%" cy="18%" r="78%"><stop stop-color="#FFF" stop-opacity=".68"/><stop offset=".4" stop-color="#FFF" stop-opacity=".04"/><stop offset="1" stop-color="#07111F" stop-opacity=".42"/></radialGradient>
    <radialGradient id="visor" cx="35%" cy="18%" r="90%"><stop stop-color="#344662"/><stop offset=".4" stop-color="#111B31"/><stop offset="1" stop-color="#030711"/></radialGradient>
    <linearGradient id="visor-edge" x1="64" y1="64" x2="195" y2="190" gradientUnits="userSpaceOnUse"><stop stop-color="#C9FFFF"/><stop offset=".35" stop-color="#54DFFF"/><stop offset=".75" stop-color="#666EFF"/><stop offset="1" stop-color="#F072DD"/></linearGradient>
    <filter id="sphere-depth" x="-45%" y="-45%" width="190%" height="205%"><feDropShadow dx="0" dy="11" stdDeviation="11" flood-color="#070D29" flood-opacity=".62"/><feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#59DFFF" flood-opacity=".42"/></filter>
    <filter id="face-light" x="-140%" y="-140%" width="380%" height="380%"><feGaussianBlur stdDeviation="2.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
