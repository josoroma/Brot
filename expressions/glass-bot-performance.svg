        <path d="M104 157C118 168 138 168 152 157" fill="none" stroke="#8EF8FF" stroke-width="6" stroke-linecap="round"><animate attributeName="d" values="M104 157C118 168 138 168 152 157;M109 160C119 157 137 157 147 160;M111 153C117 180 139 180 145 153;M108 165C120 159 136 159 148 165;M104 157C118 168 138 168 152 157" keyTimes="0;.24;.52;.78;1" dur="5s" repeatCount="indefinite"/></path>
