    <g transform="translate(128 128)"><g><animateTransform attributeName="transform" type="scale" values="1;1;1.08;1.08;1" keyTimes="0;.18;.58;.76;1" dur="5s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1"/>
      <g transform="translate(-128 -128)">
        <g filter="url(#orb-shadow)"><animateTransform attributeName="transform" type="rotate" values="0 128 128;0 128 128;5 128 128;5 128 128;0 128 128" keyTimes="0;.18;.58;.76;1" dur="5s" repeatCount="indefinite"/>
          <circle cx="128" cy="126" r="82" fill="url(#orb)"/>
          <circle cx="128" cy="126" r="82" fill="url(#soft-light)"/>
          <path d="M77 73C99 51 137 43 166 56" fill="none" stroke="#FFF" stroke-width="6" stroke-linecap="round" opacity=".28"/>
          <g fill="url(#eye)" filter="url(#eye-depth)">
