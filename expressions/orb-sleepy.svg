            <ellipse cx="157" cy="108" rx="12" ry="20"><animate attributeName="cx" values="157;157;148;148;157" keyTimes="0;.18;.58;.76;1" dur="5s" repeatCount="indefinite"/><animate attributeName="cy" values="108;108;116;116;108" keyTimes="0;.18;.58;.76;1" dur="5s" repeatCount="indefinite"/><animate attributeName="rx" values="12;12;14;14;12" keyTimes="0;.18;.58;.76;1" dur="5s" repeatCount="indefinite"/><animate attributeName="ry" values="20;20;7;7;20" keyTimes="0;.18;.58;.76;1" dur="5s" repeatCount="indefinite"/></ellipse>
          </g>
          <path d="M116 157C123 161 133 161 140 157" fill="none" stroke="#25272C" stroke-width="5" stroke-linecap="round" opacity=".88"><animate attributeName="d" values="M116 157C123 161 133 161 140 157;M116 157C123 161 133 161 140 157;M113 162C122 157 134 157 143 162;M113 162C122 157 134 157 143 162;M116 157C123 161 133 161 140 157" keyTimes="0;.18;.58;.76;1" dur="5s" repeatCount="indefinite"/></path>
        </g>
