<svg xmlns="http://www.w3.org/2000/svg" width="480" height="240" viewBox="0 0 480 240" role="img" aria-labelledby="title desc">
  <title id="title">Brot animated logo</title>
  <desc id="desc">A compact luminous Brot wordmark whose letter o is the spherical featured multi-expression bot.</desc>
  <defs>
    <linearGradient id="word" x1="28" y1="45" x2="528" y2="194" gradientUnits="userSpaceOnUse"><stop stop-color="#7CFAFF"/><stop offset=".4" stop-color="#42B8FF"/><stop offset=".72" stop-color="#7D72FF"/><stop offset="1" stop-color="#F063D8"/><animate attributeName="x1" values="0;110;0" dur="5s" repeatCount="indefinite"/></linearGradient>
    <radialGradient id="shell" cx="30%" cy="20%" r="82%"><stop stop-color="#E7FFFF"/><stop offset=".2" stop-color="#70F2FF"/><stop offset=".52" stop-color="#3F9EFF"/><stop offset=".78" stop-color="#756DFF"/><stop offset="1" stop-color="#B34DD1"/></radialGradient>
    <radialGradient id="shell-shade" cx="31%" cy="18%" r="78%"><stop stop-color="#FFF" stop-opacity=".68"/><stop offset=".4" stop-color="#FFF" stop-opacity=".04"/><stop offset="1" stop-color="#07111F" stop-opacity=".42"/></radialGradient>
    <radialGradient id="visor" cx="35%" cy="18%" r="90%"><stop stop-color="#344662"/><stop offset=".4" stop-color="#111B31"/><stop offset="1" stop-color="#030711"/></radialGradient>
    <linearGradient id="visor-edge" x1="64" y1="64" x2="195" y2="190" gradientUnits="userSpaceOnUse"><stop stop-color="#C9FFFF"/><stop offset=".35" stop-color="#54DFFF"/><stop offset=".75" stop-color="#666EFF"/><stop offset="1" stop-color="#F072DD"/></linearGradient>
    <filter id="logo-glow" x="-30%" y="-55%" width="160%" height="210%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#1F7DFF" flood-opacity=".28"/><feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#54EFFF" flood-opacity=".38"/></filter>
    <filter id="face-light" x="-140%" y="-140%" width="380%" height="380%"><feGaussianBlur stdDeviation="2.8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <g filter="url(#logo-glow)">
    <animateTransform attributeName="transform" type="translate" values="0 2;0 -2;0 2" keyTimes="0;.5;1" dur="5s" repeatCount="indefinite"/>
    <text x="28" y="176" fill="url(#word)" font-family="Arial Rounded MT Bold, Arial, sans-serif" font-size="158" font-weight="900" letter-spacing="-10">Br</text>
    <text x="360" y="176" fill="url(#word)" font-family="Arial Rounded MT Bold, Arial, sans-serif" font-size="158" font-weight="900" letter-spacing="-9">t</text>
    <g transform="translate(175 18) scale(.8)">
      <g><animateTransform attributeName="transform" type="rotate" values="0 128 128;-6 128 128;3 128 128;-3 128 128;0 128 128" keyTimes="0;.24;.52;.78;1" dur="5s" repeatCount="indefinite"/>
        <circle cx="128" cy="126" r="92" fill="url(#shell)"/>
        <circle cx="128" cy="126" r="92" fill="url(#shell-shade)"/>
        <path d="M72 73C96 43 144 31 177 52" fill="none" stroke="#FFF" stroke-width="8" stroke-linecap="round" opacity=".42"/>
        <path d="M193 89C207 124 198 164 172 187" fill="none" stroke="#F8A3EA" stroke-width="5" stroke-linecap="round" opacity=".28"/>
        <rect x="55" y="62" width="146" height="133" rx="60" fill="url(#visor)" stroke="url(#visor-edge)" stroke-width="4"/>
        <path d="M80 76C104 57 154 56 178 76" fill="none" stroke="#FFF" stroke-width="5" stroke-linecap="round" opacity=".16"/>
        <g fill="#F8FFFF" filter="url(#face-light)">
          <rect x="84" y="104" width="28" height="31" rx="14"><animate attributeName="x" values="84;88;81;85;84" keyTimes="0;.24;.52;.78;1" dur="5s" repeatCount="indefinite"/><animate attributeName="y" values="104;107;98;116;104" keyTimes="0;.24;.52;.78;1" dur="5s" repeatCount="indefinite"/><animate attributeName="width" values="28;24;34;27;28" keyTimes="0;.24;.52;.78;1" dur="5s" repeatCount="indefinite"/><animate attributeName="height" values="31;25;40;12;31" keyTimes="0;.24;.52;.78;1" dur="5s" repeatCount="indefinite"/><animate attributeName="rx" values="14;12;17;6;14" keyTimes="0;.24;.52;.78;1" dur="5s" repeatCount="indefinite"/></rect>
          <rect x="144" y="104" width="28" height="31" rx="14"><animate attributeName="x" values="144;148;141;144;144" keyTimes="0;.24;.52;.78;1" dur="5s" repeatCount="indefinite"/><animate attributeName="y" values="104;103;98;116;104" keyTimes="0;.24;.52;.78;1" dur="5s" repeatCount="indefinite"/><animate attributeName="width" values="28;20;34;27;28" keyTimes="0;.24;.52;.78;1" dur="5s" repeatCount="indefinite"/><animate attributeName="height" values="31;31;40;12;31" keyTimes="0;.24;.52;.78;1" dur="5s" repeatCount="indefinite"/><animate attributeName="rx" values="14;10;17;6;14" keyTimes="0;.24;.52;.78;1" dur="5s" repeatCount="indefinite"/></rect>
        </g>
        <path d="M104 157C118 168 138 168 152 157" fill="none" stroke="#8EF8FF" stroke-width="6" stroke-linecap="round"><animate attributeName="d" values="M104 157C118 168 138 168 152 157;M109 160C119 157 137 157 147 160;M111 153C117 180 139 180 145 153;M108 165C120 159 136 159 148 165;M104 157C118 168 138 168 152 157" keyTimes="0;.24;.52;.78;1" dur="5s" repeatCount="indefinite"/></path>
      </g>
    </g>
  </g>
</svg>
